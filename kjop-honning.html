<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kjøp honning - Birøkter App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
  </style>
    <link rel="icon" type="image/png" href="assets/icon_square.png">
    <link rel="apple-touch-icon" href="assets/icon_square.png">
</head>
<body class="bg-gray-50 flex flex-col items-center min-h-screen w-screen">
  <div class="app-viewport">
    <!-- Header Container -->
    <div id="app-header"></div>

    <div class="app-content p-4 w-full">
      <h1 class="text-2xl font-bold mb-4 text-black text-center">Butikk</h1>
      <p class="text-sm text-gray-600 text-center mb-6">Deilig honning og biprodukter direkte fra birøkteren.</p>
      
      <div id="shop_list" class="grid grid-cols-2 gap-4">
        <!-- Products will be injected here -->
      </div>
      
      <div id="empty_msg" class="hidden text-center text-gray-500 mt-10">
        <p>Ingen varer i butikken ennå.</p>
      </div>
    </div>
    
    <div id="app-footer"></div>
  </div>
</body>
<script src="header.js"></script>
<link rel="manifest" href="manifest.json">
<script>
    let products = [];

    function loadShop() {
        try { products = JSON.parse(localStorage.getItem('products') || '[]'); } catch (e) {}
        renderShop();
    }

    function renderShop() {
        const list = document.getElementById('shop_list');
        const empty = document.getElementById('empty_msg');
        list.innerHTML = '';

        if (products.length === 0) {
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');

        products.forEach(p => {
            const item = document.createElement('div');
            item.className = 'bg-white rounded-lg shadow overflow-hidden flex flex-col';
            
            // Image
            const img = document.createElement('img');
            img.src = p.image || 'assets/icon_square.png';
            img.className = 'w-full h-32 object-cover';
            item.appendChild(img);

            // Content
            const content = document.createElement('div');
            content.className = 'p-3 flex-1 flex flex-col';
            
            content.innerHTML = `
                <h3 class="font-bold text-sm text-gray-900 mb-1">${p.name}</h3>
                <p class="text-xs text-gray-500 mb-2 line-clamp-2">${p.description || ''}</p>
                <div class="mt-auto flex justify-between items-center">
                    <span class="font-bold text-black">${p.price},-</span>
                    <span class="text-xs text-gray-400">/ ${p.unit}</span>
                </div>
                <button class="w-full mt-3 bg-[#FFD700] text-black text-xs font-bold py-2 rounded hover:bg-yellow-400 transition-colors">
                    LEGG I KURV
                </button>
            `;
            item.appendChild(content);
            list.appendChild(item);
        });
    }

    document.addEventListener('DOMContentLoaded', loadShop);
    window.addEventListener('data-synced', loadShop);
</script>
</html>
